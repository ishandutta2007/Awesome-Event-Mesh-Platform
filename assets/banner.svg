<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0a0c10" />
    </linearGradient>

    <!-- Mesh Gradient for Accent lines -->
    <linearGradient id="line-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="line-grad-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0" />
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0" />
    </linearGradient>

    <!-- Glow Effect Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Card Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bg-grad)" stroke="#30363d" stroke-width="2"/>

  <!-- Background Dynamic Mesh Network Graphics (Subtle in background) -->
  <g opacity="0.25">
    <!-- Grid Lines -->
    <line x1="100" y1="50" x2="1100" y2="50" stroke="#30363d" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="100" y1="150" x2="1100" y2="150" stroke="#30363d" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="100" y1="250" x2="1100" y2="250" stroke="#30363d" stroke-width="1" stroke-dasharray="4,4"/>

    <!-- Mesh Path 1 -->
    <path d="M 50,220 Q 250,80 450,200 T 850,100 T 1150,180" fill="none" stroke="url(#line-grad-1)" stroke-width="3">
      <animate attributeName="d" 
               values="M 50,220 Q 250,80 450,200 T 850,100 T 1150,180;
                       M 50,180 Q 250,220 450,120 T 850,220 T 1150,120;
                       M 50,220 Q 250,80 450,200 T 850,100 T 1150,180" 
               dur="12s" repeatCount="indefinite" />
    </path>

    <!-- Mesh Path 2 -->
    <path d="M 50,80 Q 300,250 600,100 T 1150,240" fill="none" stroke="url(#line-grad-2)" stroke-width="2">
      <animate attributeName="d" 
               values="M 50,80 Q 300,250 600,100 T 1150,240;
                       M 50,120 Q 300,60 600,220 T 1150,100;
                       M 50,80 Q 300,250 600,100 T 1150,240" 
               dur="15s" repeatCount="indefinite" />
    </path>

    <!-- Pulsing Mesh Nodes -->
    <circle cx="250" cy="140" r="4" fill="#38bdf8" filter="url(#glow)">
      <animate attributeName="r" values="3;7;3" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="170" r="5" fill="#818cf8" filter="url(#glow)">
      <animate attributeName="r" values="4;8;4" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="900" cy="110" r="4" fill="#c084fc" filter="url(#glow)">
      <animate attributeName="r" values="3;6;3" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="3.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Main Text Container (Foreground - Centered & Crisp) -->
  <g text-anchor="middle">
    <!-- Icon / Symbol -->
    <g transform="translate(600, 75)" filter="url(#glow)">
      <circle cx="0" cy="0" r="22" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
      <path d="M -8,-6 L 8,-6 L 0,10 Z" fill="none" stroke="#38bdf8" stroke-width="2"/>
      <circle cx="-8" cy="-6" r="3" fill="#818cf8"/>
      <circle cx="8" cy="-6" r="3" fill="#c084fc"/>
      <circle cx="0" cy="10" r="3" fill="#38bdf8"/>
    </g>

    <!-- Title -->
    <text x="600" y="155" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="42" font-weight="800" letter-spacing="0.5">
      Awesome Event Mesh Platform
    </text>

    <!-- Subtitle -->
    <text x="600" y="200" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" letter-spacing="0.2">
      Curated Ecosystem of Enterprise SaaS &amp; Open-Source Distributed Event Meshes
    </text>

    <!-- Highlight Badges/Pills in Header -->
    <g transform="translate(600, 240)">
      <rect x="-180" y="-14" width="110" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <text x="-125" y="4" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="600">⚡ Multi-Protocol</text>

      <rect x="-55" y="-14" width="110" height="26" rx="13" fill="#1e293b" stroke="#818cf8" stroke-width="1"/>
      <text x="0" y="4" fill="#818cf8" font-family="sans-serif" font-size="12" font-weight="600">🌐 Hybrid Cloud</text>

      <rect x="70" y="-14" width="110" height="26" rx="13" fill="#1e293b" stroke="#c084fc" stroke-width="1"/>
      <text x="125" y="4" fill="#c084fc" font-family="sans-serif" font-size="12" font-weight="600">🔥 Real-Time</text>
    </g>
  </g>
</svg>
